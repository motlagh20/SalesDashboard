<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.25" />

  <!-- Main Roof Tile / Terracotta Clay Icon Group -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Roof Tile 1 (Left Back) -->
    <path d="M-130,-40 C-130,-110 -60,-150 0,-150 C60,-150 130,-110 130,-40 L110,120 C110,135 95,150 75,150 L-75,150 C-95,150 -110,135 -110,120 Z" fill="url(#clayGrad)" />
    
    <!-- Roof Tile Ridge Highlight -->
    <path d="M0,-150 C30,-150 60,-130 80,-80 L60,110 L0,150 L-60,110 L-80,-80 C-60,-130 -30,-150 0,-150 Z" fill="url(#goldGrad)" opacity="0.35" />

    <!-- Stylized Clay Bricks / Pattern -->
    <rect x="-65" y="-30" width="55" height="35" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="10" y="-30" width="55" height="35" rx="6" fill="#ffffff" opacity="0.9" />
    
    <rect x="-95" y="20" width="55" height="35" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="-25" y="20" width="55" height="35" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="45" y="20" width="55" height="35" rx="6" fill="#ffffff" opacity="0.9" />

    <rect x="-65" y="70" width="55" height="35" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="10" y="70" width="55" height="35" rx="6" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Title Label Bottom -->
  <text x="256" y="445" font-family="Vazirmatn, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="1">طبرستان</text>
</svg>
