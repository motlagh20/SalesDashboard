<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Golden Border Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldHighlight)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Main Terracotta Roof Tile Crest Emblem -->
  <g filter="url(#shadow)">
    <!-- Top Primary Interlocking Roof Tile Curve -->
    <path d="M 120 220 C 120 130, 200 90, 256 90 C 312 90, 392 130, 392 220 C 392 240, 376 255, 356 255 C 336 255, 320 240, 320 225 C 320 170, 280 140, 256 140 C 232 140, 192 170, 192 225 C 192 240, 176 255, 156 255 C 136 255, 120 240, 120 220 Z" fill="url(#tileGrad1)" />

    <!-- Second Layer Roof Tile Arch -->
    <path d="M 140 300 C 140 230, 205 190, 256 190 C 307 190, 372 230, 372 300 C 372 320, 356 335, 336 335 C 316 335, 300 320, 300 305 C 300 260, 275 235, 256 235 C 237 235, 212 260, 212 305 C 212 320, 196 335, 176 335 C 156 335, 140 320, 140 300 Z" fill="url(#tileGrad2)" />

    <!-- Third Foundation Roof Tile Base -->
    <path d="M 160 370 C 160 320, 210 285, 256 285 C 302 285, 352 320, 352 370 C 352 385, 340 395, 325 395 C 310 395, 298 385, 298 375 C 298 345, 278 325, 256 325 C 234 325, 214 345, 214 375 C 214 385, 202 395, 187 395 C 172 395, 160 385, 160 370 Z" fill="url(#tileGrad1)" />

    <!-- Top Accent Star / Diamond -->
    <polygon points="256,52 265,72 285,72 269,84 275,104 256,92 237,104 243,84 227,72 247,72" fill="url(#goldHighlight)" />
  </g>

  <!-- Persian Label -->
  <text x="256" y="465" font-family="'Vazirmatn', 'Tahoma', sans-serif" font-weight="900" font-size="40" fill="#f8fafc" text-anchor="middle" letter-spacing="1">طبرستان</text>
</svg>
